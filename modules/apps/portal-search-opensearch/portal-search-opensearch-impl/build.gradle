deploy {
	finalizedBy deploySidecar
}

deployDependencies {
	from configurations.compileOnly

	include "stax2-api-*.jar"
	include "woodstox-core-*jar"

	rename(/stax2-api-(.+)\.jar/, "org.codehaus.stax2" + renameSuffix)
	rename(/woodstox-core-(.+)\.jar/, "com.ctc.wstx" + renameSuffix)
}

deploySidecar {
	dependsOn cleanSidecar

	description = "Assembles the OpenSearch sidecar and deploys it to Liferay."
	group = "build"

	destinationDir = sidecarDeployDir

	enabled = !destinationDir.exists()

	ext {
		autoClean = false
	}

	from {
		file("${buildDir}/opensearch-" + sidecarOpensearchServerVersion)
	}

	doFirst {
		FileUtil.get(project, opensearchDownloadURL, opensearchDistributionFile, false, true)

		project.copy {
			fileMode = 0777
			includeEmptyDirs = false

			exclude "opensearch-${sidecarOpensearchServerVersion}/modules/ingest-geoip/**"
			exclude "opensearch-${sidecarOpensearchServerVersion}/modules/x-pack-ml/platform/linux-x86_64/bin/controller"
			include "opensearch-${sidecarOpensearchServerVersion}/lib/**"
			include "opensearch-${sidecarOpensearchServerVersion}/modules/**"

			into buildDir
			from tarTree(opensearchDistributionFile)
		}
	}

	doLast {
		logger.lifecycle "Deployed OpenSearch Sidecar: {}", destinationDir
	}
}

test {
	dependsOn {
		configurations.compileOnly

		deploySidecar {
			destinationDir = file("tmp/sidecar-opensearch")
			enabled = true
		}
	}

	forkEvery = 0

	doFirst {
		File libProcessExecutorDir = file("tmp/lib-process-executor")

		if (!libProcessExecutorDir.exists()) {
			libProcessExecutorDir.mkdir()
		}

		project.copy {
			include "com.liferay.petra.*.jar"

			configurations.compileOnly.allDependencies.each {
				rename "-${it.version}", ""
			}

			into libProcessExecutorDir.getPath()
			from configurations.compileOnly
		}
	}
}

_createPluginTasks(sidecarOpensearchServerVersion, sidecarPluginURLs)

private void _createPluginTasks(String sidecarOpensearchServerVersion, List<String> sidecarPluginURLs) {
	sidecarPluginURLs.each {
		String url ->

		String fileName = url.substring(url.lastIndexOf("/") + 1)

		String suffix = fileName.replaceAll(/[\.-](\w)/) {
			return it[1].toUpperCase()
		}

		Task installPluginTask = tasks.create(name: "installPlugin" + StringUtil.capitalize(suffix)) {
			doLast {
				FileUtil.get(project, url, new File(project.buildDir, fileName), false, true)

				String dirName = fileName.take(fileName.lastIndexOf("-" + sidecarOpensearchServerVersion))

				project.copy {
					fileMode = 0777
					includeEmptyDirs = false

					into new File(buildDir, "opensearch-${sidecarOpensearchServerVersion}/plugins/${dirName}")
					from zipTree(new File(project.buildDir, fileName))
				}
			}
		}

		deploySidecar.dependsOn installPluginTask

		installPluginTask.mustRunAfter cleanSidecar
	}
}